name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  module:
    uses: Aqamoe/FGB-Module-Kit/.github/workflows/module-ci.yml@v0.1.1
    with:
      # 冒烟测试会绑 12345 端口，GitHub 的 Windows runner 上是空闲的，
      # 这一项是真正的端到端 ABI 校验，别关掉。
      run_smoke: true
    secrets: inherit
